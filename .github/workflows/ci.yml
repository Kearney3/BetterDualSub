name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-message:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pull request commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" | ./script/check-commit-message.sh /dev/stdin
          done < <(git rev-list --no-merges "origin/$BASE_REF"..HEAD)

  test:
    name: Test & Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Build app (Debug)
        run: |
          xcodebuild -project BetterDualSub.xcodeproj -scheme BetterDualSub \
            -configuration Debug -derivedDataPath build MACOSX_DEPLOYMENT_TARGET=26.0 CODE_SIGNING_ALLOWED=NO build
