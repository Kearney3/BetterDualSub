name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Build app (Release)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project BetterDualSub.xcodeproj -scheme BetterDualSub \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=26.0 CODE_SIGNING_ALLOWED=NO build

      - name: Ad-hoc sign and create DMG (arm64)
        run: |
          APP="build/Build/Products/Release/BetterDualSub.app"
          lipo -archs "$APP/Contents/MacOS/BetterDualSub"
          codesign --force --deep --sign - "$APP"
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "BetterDualSub" -srcfolder dmg-root -ov -format UDZO \
            "BetterDualSub-${GITHUB_REF_NAME}-arm64.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "BetterDualSub-${GITHUB_REF_NAME}-arm64.dmg" \
            --title "BetterDualSub ${GITHUB_REF_NAME}" --generate-notes --verify-tag

      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(shasum -a 256 "BetterDualSub-${GITHUB_REF_NAME}-arm64.dmg" | cut -d ' ' -f 1)"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" \
            Casks/betterdualsub.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): update Homebrew cask to ${VERSION}"
          git push origin main
